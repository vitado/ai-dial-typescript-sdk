name: w3-spike
on: workflow_dispatch
permissions:
  actions: read
  contents: read
jobs:
  spike:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: gh api
        run: |
          set -x
          gh api "repos/epam/ai-dial-chat/actions/runs?status=completed&per_page=3" --jq '.workflow_runs[]|[.id,.name,.conclusion]|@tsv'
          read -r RUN ART < <(gh api "repos/epam/ai-dial-chat/actions/artifacts?per_page=20" --jq '[.artifacts[]|select(.expired|not)][0]|[.workflow_run.id,.id]|@tsv')
          echo "run=$RUN art=$ART"
          echo "RUN_ID=$RUN" >> "$GITHUB_ENV"
          gh api "repos/epam/ai-dial-chat/actions/runs/$RUN/artifacts" --jq '.artifacts[]|[.id,.name,.size_in_bytes]|@tsv'
          gh api "repos/epam/ai-dial-chat/actions/artifacts/$ART/zip" > a.zip
          ls -l a.zip
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          repository: epam/ai-dial-chat
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
          path: dl
      - run: ls -lR dl | head -20
