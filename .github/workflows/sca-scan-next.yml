name: SCA Scan (next)

# Next-iteration caller on the fork: manual runs only, removed once merged upstream.
on:
  workflow_dispatch: {}

concurrency:
  group: sca-scan-next
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  sca:
    uses: vitado/ai-dial-ci/.github/workflows/sca_scheduled.yml@pilot/sca-next
    with:
      repository: epam/ai-dial-typescript-sdk
