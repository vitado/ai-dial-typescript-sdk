name: SCA Scan

# Pilot caller on the fork: manual runs only, the schedule is added when rolled out upstream.

on:
  schedule:
    # hourly pilot schedule (temporary): validating the schedule path of the contour
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      scan-tag:
        description: "Focus the run on this one git tag (its source and the tag in every image) instead of the release set; empty = the full set"
        type: string
        default: ""
      force-image-scan:
        description: "On this one run, run the direct OSV image scan also where it is off for this repository"
        type: boolean
        default: false

run-name: >-
  ${{ github.event_name == 'schedule' && 'SCA - scheduled'
  || format('SCA - manual by {0}{1}', github.triggering_actor,
     inputs.scan-tag && format(' - tag {0}', inputs.scan-tag) || '') }}

concurrency:
  group: sca-scan
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  sca:
    uses: vitado/ai-dial-ci/.github/workflows/sca_scheduled.yml@pilot/sca-split
    with:
      repository: epam/ai-dial-typescript-sdk
      scan-tag: ${{ inputs.scan-tag }}
      force-image-scan: ${{ inputs.force-image-scan || false }}
